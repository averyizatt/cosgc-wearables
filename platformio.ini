; PlatformIO build of the live-microphone firmware: ESP32-S3 N16R8 + INMP441 mic + 0.96" SSD1306 I2C OLED.
; Open this repo folder in VS Code with the PlatformIO extension (no workspace file needed), then use the
; PlatformIO toolbar/sidebar, or from a terminal:
;   pio run -t upload        build and flash app + model + language model (the 14 MB model takes ~2 min to write)
;   pio device monitor       transcripts on serial (they also show on the OLED)
; Pins live in esp32/firmware/sdkconfig.myboard; wiring is in WIRING.md.
; ESP-IDF can't build from a path containing spaces ("Detected a whitespace character in project paths").
; Move the repo, or on Windows map a drive letter to its parent and open the project from there:
;   subst P: "C:\path with spaces"      then open P:\cosgc-wearables in VS Code (redo after each reboot)

[platformio]
src_dir = esp32/firmware/main
default_envs = oido_s3

[env]
platform = espressif32@6.13.0          ; ESP-IDF 5.5.3
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = esp32/firmware/partitions_nemo16lm.csv
board_upload.maximum_size = 524288     ; 'factory' app partition in partitions_nemo16lm.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.defaults;esp32/firmware/sdkconfig.nemo16lm;esp32/firmware/sdkconfig.pio;esp32/firmware/sdkconfig.myboard
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:esp32/firmware/pio_images.py
custom_lm = models/nemo_lm.tlm

; Streaming English model: partial text follows you on the OLED while you speak, final line after each pause.
[env:oido_s3]
custom_model = models/oido_stream.tnm

; The same, on both cores (experimental: spin-wait jobs, see oido_s3_bench_2c): final text about twice as soon.
; Core 1 never sleeps in this mode.
[env:oido_s3_2c]
custom_model = models/oido_stream.tnm
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.defaults;esp32/firmware/sdkconfig.nemo16lm;esp32/firmware/sdkconfig.pio;esp32/firmware/sdkconfig.myboard;esp32/firmware/sdkconfig.dual -DTASR_2C=1

; Most accurate English model (utterance mode): text appears a few seconds after you stop talking.
[env:oido_s3_accurate]
custom_model = models/nemo8.tnm

; Benchmark (no mic): flashes the clips from esp32/tools/bench_clips.py and prints, per clip, the real-time factor in
; utterance and streaming mode and when the final text appears at the pace of speech, then cycles per stage (PROF) and
; the kernel memory benchmark (KBENCH). Make the clips once (python esp32/tools/bench_clips.py), then:
;   pio run -e oido_s3_bench -t upload && pio device monitor -e oido_s3_bench      (ends with DONE, about 2 minutes)
[env:oido_s3_bench]
custom_model = models/oido_stream.tnm
custom_clips = esp32/firmware/bench_clips/clips.json
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.defaults;esp32/firmware/sdkconfig.nemo16lm;esp32/firmware/sdkconfig.pio;esp32/firmware/sdkconfig.bench


; Quicker benchmark (about 2 minutes): the streaming passes only, without the kernel benchmark.
[env:oido_s3_bench_stream]
extends = env:oido_s3_bench
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.defaults;esp32/firmware/sdkconfig.nemo16lm;esp32/firmware/sdkconfig.pio;esp32/firmware/sdkconfig.bench;esp32/firmware/sdkconfig.quick

; Experimental: the same benchmark with the work split across both cores (TASR_2C). Wrong transcripts or crashes
; were seen with the original kernels (README, "Dual core"); compare its HYP / SHYP lines with oido_s3_bench's.
[env:oido_s3_bench_2c]
extends = env:oido_s3_bench
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.defaults;esp32/firmware/sdkconfig.nemo16lm;esp32/firmware/sdkconfig.pio;esp32/firmware/sdkconfig.bench;esp32/firmware/sdkconfig.quick;esp32/firmware/sdkconfig.dual -DTASR_2C=1

; Two cores plus the Bluetooth LE service (the device API over BLE, pairing with a PIN shown on the screen).
; The app gets a 1 MB partition (esp32/firmware/partitions_nemo16ble.csv); upload as usual.
[env:oido_s3_ble]
extends = env:oido_s3_2c
board_build.partitions = esp32/firmware/partitions_nemo16ble.csv
board_upload.maximum_size = 1048576
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.defaults;esp32/firmware/sdkconfig.nemo16lm;esp32/firmware/sdkconfig.pio;esp32/firmware/sdkconfig.myboard;esp32/firmware/sdkconfig.ble;esp32/firmware/sdkconfig.dual -DTASR_2C=1

; The same with "just works" pairing, for development and scripts (anyone in range can pair).
[env:oido_s3_ble_dev]
extends = env:oido_s3_ble
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.defaults;esp32/firmware/sdkconfig.nemo16lm;esp32/firmware/sdkconfig.pio;esp32/firmware/sdkconfig.myboard;esp32/firmware/sdkconfig.ble;esp32/firmware/sdkconfig.ble_dev;esp32/firmware/sdkconfig.dual -DTASR_2C=1

; Speed with the Bluetooth radio running (advertising): the quick two-core benchmark with one clip, since the BLE layout's
; clip partition is 256 KB. Compare its STREAM RTF with the same clip in oido_s3_bench_2c.
[env:oido_s3_bench_ble]
extends = env:oido_s3_bench_2c
board_build.partitions = esp32/firmware/partitions_nemo16ble.csv
board_upload.maximum_size = 1048576
custom_clips = esp32/firmware/bench_clips/clips1.json
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.defaults;esp32/firmware/sdkconfig.nemo16lm;esp32/firmware/sdkconfig.pio;esp32/firmware/sdkconfig.bench;esp32/firmware/sdkconfig.quick;esp32/firmware/sdkconfig.ble;esp32/firmware/sdkconfig.ble_dev;esp32/firmware/sdkconfig.dual -DTASR_2C=1

; Reference for the Bluetooth speed comparison: the two-core firmware on the Bluetooth flash layout, without Bluetooth.
[env:oido_s3_2c_l1m]
extends = env:oido_s3_2c
board_build.partitions = esp32/firmware/partitions_nemo16ble.csv
board_upload.maximum_size = 1048576
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.defaults;esp32/firmware/sdkconfig.nemo16lm;esp32/firmware/sdkconfig.pio;esp32/firmware/sdkconfig.myboard;esp32/firmware/sdkconfig.l1m;esp32/firmware/sdkconfig.dual -DTASR_2C=1

; ESP32-P4 board (32 MB flash, 32 MB PSRAM, onboard microphone on an ES8311 codec), one core, P4 vector kernels. The benchmark
; below runs on a real board; this microphone firmware builds but has not run yet. The USB port is a serial bridge to UART0,
; which carries the console and the device API. Needs a rev 3 chip. Flash with esp32/tools/flash_p4.py (the model crosses
; 16 MB, which pio upload cannot write); see docs/P4.md.
[env:oido_p4]
; PlatformIO's own espressif32 platform has no ESP32-P4; the pioarduino fork does (ESP-IDF 5.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = waveshare_esp32_p4_pico
board_build.flash_mode = qio
board_upload.flash_size = 32MB
board_build.partitions = esp32/firmware/partitions_p4_32.csv
board_upload.maximum_size = 1048576     ; the 1 MB factory partition in partitions_p4_32.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.p4
extra_scripts = pre:esp32/firmware/pio_images.py, post:esp32/firmware/pio_nostub.py
custom_model = models/oido_stream.tnm

; P4 benchmark (no mic): the streaming passes on the flashed clips, as oido_s3_bench_stream. Prints the P4SELFTEST lines,
; then STREAM / TOTAL (wall RTF) and PROF lines. Measured on a board: 0.759 (S3, one core: 1.54).
[env:oido_p4_bench]
extends = env:oido_p4
custom_clips = esp32/firmware/bench_clips/clips.json
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.p4;esp32/firmware/sdkconfig.bench;esp32/firmware/sdkconfig.quick

; The same on both cores (spin-wait jobs, as oido_s3_bench_2c): core 1 never sleeps. Compare its SHYP lines with oido_p4_bench's.
[env:oido_p4_bench_2c]
extends = env:oido_p4_bench
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.p4;esp32/firmware/sdkconfig.bench;esp32/firmware/sdkconfig.quick;esp32/firmware/sdkconfig.dual -DTASR_2C=1

; The same with the full-context (utterance) pass on each clip before its streaming pass: prints UTT lines with their time.
[env:oido_p4_bench_full_2c]
extends = env:oido_p4_bench
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.p4;esp32/firmware/sdkconfig.bench;esp32/firmware/sdkconfig.dual -DTASR_2C=1

; Microphone firmware on both cores: the headroom for the 24-layer model.
[env:oido_p4_2c]
extends = env:oido_p4
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=esp32/firmware/sdkconfig.p4;esp32/firmware/sdkconfig.dual -DTASR_2C=1
